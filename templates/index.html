<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Clone Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="container">
    <h1>AI Voice Clone Detection</h1>
    <p>Upload a WAV audio file to check whether it is real or AI-generated.</p>

    <form action="/predict" method="POST" enctype="multipart/form-data">
        <input type="file" name="audio" accept=".wav,audio/wav" required>
        <button type="submit">Analyze Voice</button>
    </form>

    <a class="link" href="/history">View Detection History</a>
</div>
</body>
</html>
